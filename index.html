        ${s.teams.map(t => `
          <div class="frow">
            <span style="min-width:64px"><b>${esc(t.owner)}</b></span>
            <input id="tn-${t.id}" value="${esc(t.name)}" style="flex:1;min-width:130px">
            <input id="tp-${t.id}" value="${esc(t.pin)}" style="width:80px" title="PIN">
            <button class="btn sm" onclick="Views.saveTeam(${t.id})">Save</button>
          </div>`).join("")}
      </div>
      <div class="card">
        <h2>General Rules</h2>
        <p class="sub">Shown on the League page. One rule per line.</p>
        <textarea id="gr-in" rows="4" style="width:100%;margin-top:6px">${generalRules(s).map(r => esc(r)).join("\n")}</textarea>
        <div class="btnrow" style="margin-top:8px"><button class="btn sm" onclick="Views.saveRules()">Save rules</button></div>
      </div>`;
  },
  saveRules() {
    const items = $("gr-in").value.split("\n").map(x => x.trim()).filter(Boolean);
    App.mutate(() => App.store.saveSetting("general_rules", { items }), "General rules saved");
  },
  saveTeam(teamId) {
    const name = $("tn-" + teamId).value.trim();
    const pin = $("tp-" + teamId).value.trim();
    if (!name || !pin) { toast("Name and PIN can't be empty"); return; }
    App.mutate(() => App.store.updateTeam(teamId, { name, pin }), "Team saved");
  },
  setLock(week, mode) {
    const cur = { ...(App.state.settings.lineup_locks || {}) };
    if (mode === "auto") delete cur[week]; else cur[week] = mode;
    const msg = mode === "locked" ? `Week ${week} lineups locked for everyone` : mode === "open" ? `Week ${week} lineups unlocked for everyone` : `Week ${week} back to automatic locks`;
    App.mutate(() => App.store.saveSetting("lineup_locks", cur), msg);
  },
  _unlock() {
    if ($("cpin").value.trim() === App.state.settings.commish.pin) {
      sessionStorage.setItem("tmfl_commish", "1"); UI.render(); toast("Commissioner mode on");
    } else toast("Wrong PIN");
  },
  _feedOn() { return App.state.settings.live_sync_enabled !== false; },
  _toggleFeed() {
    const on = this._feedOn();
    App.mutate(() => App.store.saveSetting("live_sync_enabled", !on), on ? "Auto-sync off" : "Auto-sync on");
  },
  _feedStatus() {
    const lm = App.state.settings.live_meta;
    const r = LiveSync._lastResult;
    const when = ts => new Date(ts).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
    const bits = [`Auto-sync: <b>${this._feedOn() ? "ON" : "OFF"}</b>`];
    bits.push(lm && lm.updated_at ? `Last league sync: ${when(lm.updated_at)} (week ${lm.week})` : "No sync has run yet");
    if (r && r.error) bits.push(`Last attempt on this device failed: ${esc(r.error)}`);
    else if (r) bits.push(`This device: ${r.games} games read, ${r.matched} players matched, ${r.updated} stat lines updated`);
    const im = App.state.settings.injury_meta;
    bits.push(im && im.updated_at ? `Injuries: ${Object.keys(im.players || {}).length} flagged by the league report, updated ${when(im.updated_at)}` : "Injuries: not synced yet");
    const rfl = Object.keys(((App.state.settings.roster_meta || {}).flags) || {}).length;
    if (rfl) bits.push(`Roster reserve lists: ${rfl} pool players flagged`);
    const rm = App.state.settings.roster_meta;
    const rr = RosterSync._lastResult;
    if (RosterSync._running) bits.push("Team map: syncing now...");
    else if (rr && rr.error) bits.push(`Team map sync failed on this device: ${esc(rr.error)}`);
    else bits.push(rm && rm.updated_at ? `Team map: ${Object.keys(rm.teams || {}).length} of ${App.state.players.length} players mapped, updated ${when(rm.updated_at)}` : "Team map: not synced yet");
    return bits.join(" &middot; ");
  },
  saveStats(week) {
    const rows = {};
    document.querySelectorAll(".statgrid input[data-pid]").forEach(inp => {
      const pid = +inp.dataset.pid, k = inp.dataset.k;
      rows[pid] = rows[pid] || { player_id: pid, week };
      rows[pid][k] = inp.value === "" ? 0 : +inp.value || 0;
    });
    App.mutate(() => App.store.saveStats(Object.values(rows)), `Week ${week} stats saved`);
  },
  toggleFinal(week, on) {
    const fw = new Set(finalWeeks(App.state));
    if (on) fw.add(week); else fw.delete(week);
    App.mutate(() => App.store.saveSetting("final_weeks", [...fw].sort((a, b) => a - b)), on ? `Week ${week} is final` : `Week ${week} reopened`);
  },
  seedPlayoffs() {
    const rows = standings(App.state);
    if (rows.length < 4) return;
    App.mutate(async () => {
      await App.store.updateScheduleGame(16, 1, { team_a: rows[0].team.id, team_b: rows[3].team.id });
      await App.store.updateScheduleGame(16, 2, { team_a: rows[1].team.id, team_b: rows[2].team.id });
    }, "Week 16 seeded: 1v4 and 2v3");
  },
  savePlayoffGame(week, game) {
    const a = $(`po-${week}-${game}-a`).value, b = $(`po-${week}-${game}-b`).value;
    App.mutate(() => App.store.updateScheduleGame(week, game, { team_a: a ? +a : null, team_b: b ? +b : null }), "Playoff game saved");
  }
};

/* ============================================================
   Live stat feed: public ESPN scoreboard + box scores -> league stats.
   Runs in whichever browser has the page open; writes are shared.
   ============================================================ */
const LiveSync = {
  _last: 0, _running: false, _lastResult: null,
  EVERY_MS: 240000,
  enabled() { return !App.state || App.state.settings.live_sync_enabled !== false; },
  norm(n) {
    return String(n || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/["\u201c\u201d][^"\u201c\u201d]*["\u201c\u201d]/g, " ")
      .replace(/[."'\u2019,-]/g, "").replace(/\b(jr|sr|ii|iii|iv|v)\b/g, "").replace(/\s+/g, " ").trim();
  },
  nameMap() {
    const m = {};
    for (const p of App.state.players) m[this.norm(p.name)] = p;
    return m;
  },
  tick(force = false) {
    if (!App.state || this._running) return;
    if (!force) {
      if (!this.enabled()) return;
      if (Date.now() - this._last < this.EVERY_MS) return;
      const lm = App.state.settings.live_meta;
      if (lm && lm.updated_at && Date.now() - new Date(lm.updated_at).getTime() < this.EVERY_MS - 30000) { this._last = Date.now(); return; }
    }
    this._last = Date.now();
    const cw = Math.min(currentWeek(App.state), 17);
    this.sync(cw, force).then(() => this.backfill(cw)).catch(e => { this._lastResult = { error: e.message }; });
  },
  _backfilled: {},
  /* every completed week gets one closing pull after Monday night (tracked league-wide in week_pulls),
     so a week nobody had open, or Monday night stats nobody caught, still land before standings count it */
  async backfill(cw) {
    if (!App.state) return;
    const pulls = { ...(App.state.settings.week_pulls || {}) };
    let saved = false;
    for (let w = 1; w < cw; w++) {
      const s = App.state; if (!s) break;
      if (this._backfilled[w] || finalWeeks(s).includes(w) || !weekComplete(s, w)) continue;
      if (pulls[w]) { this._backfilled[w] = true; continue; }
      this._backfilled[w] = true;
      let r = null;
      try { r = await this.sync(w, false); } catch (e) { r = null; }
      if (r && r.week === w && r.games === r.due) {
        pulls[w] = new Date().toISOString();
        await App.store.saveSetting("week_pulls", pulls);
        saved = true;
      } else delete this._backfilled[w]; // incomplete pull: try again on the next tick
    }
    if (saved) await App.queueRefresh();
  },
  async sync(week, manual = false) {
    if (this._running) return;
    this._running = true;
    try {
      const s = App.state;
      if (finalWeeks(s).includes(week)) { if (manual) toast(`Week ${week} is marked final, the feed left it alone`); return; }
      const season = (s.settings.league || {}).season || new Date().getFullYear();
      const sb = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}&dates=${season}`)).json();
      const events = sb.events || [];
      const nm = this.nameMap();
      const acc = {}, meta = {};
      const zero = () => ({ td: 0, yds: 0, rec: 0, fum: 0, solo: 0, ast: 0, sack: 0, intc: 0, pbu: 0, _pd: 0, _fr: 0 });
      let gamesRead = 0, gamesDue = 0;
      for (const ev of events) {
        const comp = (ev.competitions || [])[0]; if (!comp) continue;
        const gstate = ((ev.status || {}).type || {}).state || "pre";
        const detail = ((ev.status || {}).type || {}).shortDetail || "";
        if (gstate === "pre") continue;
        gamesDue++;
        let box;
        try { box = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${ev.id}`)).json(); }
        catch (e) { continue; }
        gamesRead++;
        const sides = (box.boxscore || {}).players || [];
        for (const side of sides) {
          const myAbbr = ((side.team || {}).abbreviation) || "";
          const oppSide = sides.find(x => x !== side);
          const oppAbbr = oppSide ? (((oppSide.team || {}).abbreviation) || "") : "";
          const home = (((comp.competitors || []).find(c => ((c.team || {}).abbreviation) === myAbbr) || {}).homeAway) === "home";
          for (const cat of (side.statistics || [])) {
            const labels = (cat.labels || cat.keys || []).map(x => String(x).toUpperCase());
            const Li = lab => labels.indexOf(lab);
            for (const a of (cat.athletes || [])) {
              const disp = ((a.athlete || {}).displayName) || "";
              const p = nm[this.norm(disp)];
              if (!p) continue;
              const row = acc[p.id] = acc[p.id] || zero();
              meta[p.id] = { st: gstate, dt: detail, opp: oppAbbr, home };
              const v = i => (i >= 0 && a.stats && a.stats[i] != null) ? (parseFloat(String(a.stats[i]).split("/")[0]) || 0) : 0;
              const cn = String(cat.name || "").toLowerCase();
              if (cn === "rushing") { row.yds += v(Li("YDS")); row.td += v(Li("TD")); }
              else if (cn === "receiving") { row.rec += v(Li("REC")); row.yds += v(Li("YDS")); row.td += v(Li("TD")); }
              else if (cn === "fumbles") { row.fum += v(Li("LOST")); row._fr += v(Li("REC")); }
              else if (cn === "defensive") { const solo = v(Li("SOLO")), tot = v(Li("TOT")); row.solo += solo; row.ast += Math.max(0, tot - solo); row.sack += v(Li("SACKS")); row._pd += v(Li("PD")); row.td += v(Li("TD")); }
              else if (cn === "interceptions") { row.intc += v(Li("INT")); row.td += v(Li("TD")); }
              else if (cn === "kickreturns" || cn === "puntreturns") { row.td += v(Li("TD")); }
            }
          }
        }
      }
      const rows = [];
      for (const [pidStr, r] of Object.entries(acc)) {
        const pid = +pidStr;
        r.pbu = Math.max(0, r._pd - r.intc);
        const old = s.stats.find(x => x.player_id === pid && x.week === week) || {};
        const out = { player_id: pid, week, td: r.td, yds: Math.round(r.yds * 10) / 10, rec: r.rec, fum: r.fum, solo: r.solo, ast: r.ast, sack: Math.round(r.sack * 10) / 10, intc: r.intc, pbu: r.pbu, ffr: Math.max(old.ffr || 0, r._fr) };
        const same = ["td","yds","rec","fum","solo","ast","sack","intc","pbu","ffr"].every(k => (old[k] || 0) === out[k]);
        if (!same) rows.push(out);
      }
      if (rows.length) await App.store.saveStats(rows);
      if (week === Math.min(currentWeek(s), 17)) await App.store.saveSetting("live_meta", { week, updated_at: new Date().toISOString(), players: meta });
      this._lastResult = { week, games: gamesRead, due: gamesDue, matched: Object.keys(acc).length, updated: rows.length, at: new Date().toISOString() };
      if (manual) toast(`Feed: ${gamesRead} games read, ${rows.length} stat lines updated`);
      await App.queueRefresh();
      return this._lastResult;
    } finally { this._running = false; }
  }
};

/* ============================================================
   Injury feed: public ESPN league injury report -> red status pills.
   Refreshes every 30 min in whichever browser is open; shared via settings.
   ============================================================ */
const InjurySync = {
  _last: 0, _running: false, _lastResult: null,
  EVERY_MS: 900000,
  ABBR: { "injured reserve": "IR", "out": "O", "questionable": "Q", "doubtful": "D", "physically unable to perform": "PUP", "suspension": "SUSP", "suspended": "SUSP", "day-to-day": "DTD", "non football injury": "NFI", "non-football injury": "NFI" },
  short(status) {
    const k = String(status || "").toLowerCase().trim();
    if (!k || k === "active" || k === "healthy" || k === "probable") return null;
    if (this.ABBR[k]) return this.ABBR[k];
    return k.split(/[^a-z0-9]+/).filter(Boolean).map(w => w[0]).join("").toUpperCase().slice(0, 4) || null;
  },
  tick(force = false) {
    if (!App.state || this._running) return;
    if (!force) {
      if (Date.now() - this._last < 60000) return;
      const im = App.state.settings.injury_meta;
      if (im && im.updated_at && Date.now() - new Date(im.updated_at).getTime() < this.EVERY_MS) { this._last = Date.now(); return; }
    }
    this._last = Date.now();
    this.sync().catch(e => { this._lastResult = { error: e.message }; });
  },
  async sync(manual = false) {
    if (this._running) return;
    this._running = true;
    try {
      const s = App.state;
      const res = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries")).json();
      const teams = res.injuries || res.teams || res.items || [];
      const nm = LiveSync.nameMap();
      const players = {};
      let listed = 0;
      for (const team of teams) {
        for (const inj of (team.injuries || [])) {
          listed++;
          const a = inj.athlete || {};
          const p = nm[LiveSync.norm(a.displayName || a.fullName || "")];
          if (!p) continue;
          const full = String(inj.status || ((inj.type || {}).description) || ((inj.details || {}).type) || "").trim();
          const st = this.short(full);
          if (!st) continue;
          const det = inj.details || {};
          players[p.id] = { st, full, type: String(det.type || "").trim() || undefined, date: inj.date || undefined };
        }
      }
      const old = (s.settings.injury_meta || {}).players || {};
      const changed = JSON.stringify(old) !== JSON.stringify(players);
      await App.store.saveSetting("injury_meta", { updated_at: new Date().toISOString(), players });
      this._lastResult = { listed, matched: Object.keys(players).length, at: new Date().toISOString() };
      if (manual) toast(`Injury report synced: ${Object.keys(players).length} pool players flagged`);
      if (changed) await App.queueRefresh();
    } finally { this._running = false; }
  }
};

/* Per-week NFL schedule cache: kickoff times + live game state per team.
   In-memory only, fetched on demand for whichever week is being viewed. */
const GameTimes = {
  _cache: {}, _pending: {},
  kickLabel(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }).formatToParts(d);
    const g = t => (parts.find(x => x.type === t) || {}).value || "";
    return `${g("weekday")} ${g("hour")}:${g("minute")} ${g("dayPeriod")}`.replace(/\s+/g, " ").trim();
  },
  get(week) {
    const c = this._cache[week];
    const cur = App.state ? currentWeek(App.state) : 0;
    const maxAge = c && c.err ? 60000 : (week === cur ? 240000 : 3600000);
    if (c && Date.now() - c.at < maxAge) return c.teams;
    if (!this._pending[week]) this._pending[week] = this.fetch(week).finally(() => { delete this._pending[week]; });
    return c ? c.teams : null;
  },
  async fetch(week) {
    try {
      const s = App.state;
      const season = (s.settings.league || {}).season || new Date().getFullYear();
      const sb = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}&dates=${season}`)).json();
      const teams = {};
      for (const ev of (sb.events || [])) {
        const comp = (ev.competitions || [])[0]; if (!comp) continue;
        const st = ((ev.status || {}).type || {}).state || "pre";
        const detail = ((ev.status || {}).type || {}).shortDetail || "";
        const dt = st === "pre" ? this.kickLabel(ev.date) : st === "post" ? "Final" : detail;
        const cs = comp.competitors || [];
        for (const c of cs) {
          const abbr = ((c.team || {}).abbreviation) || ""; if (!abbr) continue;
          const opp = cs.find(x => x !== c);
          teams[abbr] = { st, dt, kick: ev.date || null, opp: opp ? (((opp.team || {}).abbreviation) || "") : "", home: c.homeAway === "home" };
        }
      }
      this._cache[week] = { at: Date.now(), teams };
      if (App.tab === "matchup" || App.tab === "team") UI.render();
    } catch (e) {
      this._cache[week] = { at: Date.now(), teams: (this._cache[week] || {}).teams || {}, err: true };
    }
  }
};

/* Weekly ESPN roster pull: maps our pool players to their real NFL team by name.
   Display names and the pool's custom nfl_team labels are never touched. */
const RosterSync = {
  _last: 0, _running: false, _lastResult: null,
  EVERY_MS: 86400000,
  tick(force = false) {
    if (!App.state || this._running) return;
    if (!force) {
      if (Date.now() - this._last < 3600000) return;
      const rm = App.state.settings.roster_meta;
      if (rm && rm.updated_at && Date.now() - new Date(rm.updated_at).getTime() < this.EVERY_MS) { this._last = Date.now(); return; }
    }
    this._last = Date.now();
    this.sync().catch(() => {});
  },
  async sync(manual = false) {
    if (this._running) return;
    this._running = true;
    try {
      const s = App.state;
      const tl = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams?limit=32")).json();
      const teams = ((((tl.sports || [])[0] || {}).leagues || [])[0] || {}).teams || [];
      const nm = LiveSync.nameMap();
      const map = {}, flags = {};
      await Promise.all(teams.map(async t => {
        const team = t.team || {};
        const abbr = team.abbreviation || "";
        if (!team.id || !abbr) return;
        let rj;
        try { rj = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/${team.id}/roster`)).json(); }
        catch (e) { return; }
        for (const grp of (rj.athletes || [])) {
          const list = grp.items || grp.athletes || ((grp.displayName || grp.fullName) ? [grp] : []);
          for (const a of list) {
            const p = nm[LiveSync.norm(a.displayName || a.fullName || "")];
            if (!p) continue;
            map[p.id] = abbr;
            const inj = (a.injuries || [])[0] || {};
            const rs = String(((a.status || {}).name) || ((a.status || {}).type) || "").toLowerCase();
            let st = inj.status ? InjurySync.short(String(inj.status)) : null, full = inj.status ? String(inj.status) : "";
            if (!st) {
              if (rs.includes("injured reserve")) { st = "IR"; full = "Injured Reserve"; }
              else if (rs.includes("physically unable")) { st = "PUP"; full = "Physically Unable to Perform"; }
              else if (rs.includes("non-football") || rs.includes("non football")) { st = "NFI"; full = (a.status || {}).name || "Non-Football Injury"; }
              else if (rs.includes("suspend")) { st = "SUSP"; full = "Suspended"; }
            }
            if (st) flags[p.id] = { st, full, type: String(((inj.details || {}).type) || "").trim() || undefined, date: inj.date || undefined, src: "roster" };
          }
        }
      }));
      if (!Object.keys(map).length) throw new Error("no players matched, map left unchanged");
      const oldMeta = s.settings.roster_meta || {};
      const teamsChanged = JSON.stringify(oldMeta.teams || {}) !== JSON.stringify(map);
      const changed = teamsChanged || JSON.stringify(oldMeta.flags || {}) !== JSON.stringify(flags);
      await App.store.saveSetting("roster_meta", { updated_at: new Date().toISOString(), teams: map, flags });
      this._lastResult = { mapped: Object.keys(map).length, at: new Date().toISOString() };
      if (manual) toast(`Team map synced: ${Object.keys(map).length} of ${s.players.length} pool players matched`);
      if (teamsChanged) GameTimes._cache = {};
      if (changed) await App.queueRefresh();
    } catch (e) {
      this._lastResult = { error: e.message };
      if (manual) toast("Team map sync failed: " + e.message);
    } finally { this._running = false; }
  }
};

window.addEventListener("DOMContentLoaded", () => App.boot());

</script>
