<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TradeMark Fantasy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#0c0d10; --surface:#15171d; --raised:#1c1f27; --line:#2a2e38;
  --text:#eceef3; --muted:#98a0af; --gold:#f5c443; --gold-deep:#c9971e;
  --live:#ff4438; --ok:#3fbf6f; --bad:#e5484d;
  --disp:"Barlow Condensed",Impact,sans-serif; --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:60px}
button{font-family:var(--body);cursor:pointer;border:none}
input,select,textarea{font-family:var(--body);background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font-size:15px}
.rulelist{margin:4px 0 0 18px;padding:0;color:var(--muted);font-size:13.5px}
.rulelist li{margin:4px 0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
a{color:var(--gold)}
.tm{font-size:.55em;vertical-align:super;opacity:.75}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#101116,#0c0d10);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text)}
.logo-img{height:38px;width:auto;display:block}
.idchip{margin-left:auto;background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--text)}
.idchip b{color:var(--gold)}

/* nav */
.nav{display:flex;gap:2px;overflow-x:auto;max-width:1100px;margin:0 auto;padding:0 8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;color:var(--muted);font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;padding:9px 13px;border-bottom:3px solid transparent;white-space:nowrap}
.nav button.on{color:var(--text);border-color:var(--gold)}

.wrap{max-width:1100px;margin:0 auto;padding:16px 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.card h3{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.sub{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--disp);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:var(--muted);text-align:left;padding:9px 10px;background:var(--raised);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.mine td{background:rgba(245,196,67,.06)}
tr.pickable{cursor:pointer}
tr.pickable:hover td{background:rgba(245,196,67,.10)}

/* buttons */
.btn{background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#141414}
.btn.gold:hover{background:#ffd35e}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* pills */
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.4px}
.pill.pos{background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.pill.fa{background:rgba(63,191,111,.15);color:var(--ok)}
.pill.own{background:rgba(245,196,67,.14);color:var(--gold)}
.pill.rk{background:rgba(152,160,175,.15);color:var(--muted)}
.pill.live{background:var(--live);color:#fff;animation:pulse 1.2s infinite}
.pill.bye{background:var(--raised);border:1px solid var(--line);color:var(--muted)}
.pill.inj{background:rgba(229,72,77,.16);border:1px solid rgba(229,72,77,.55);color:#ff8a8e}
@keyframes pulse{50%{opacity:.55}}

/* draft: on-the-clock lower third */
.otc{background:linear-gradient(100deg,var(--gold) 0 78%,var(--gold-deep) 78%);color:#141414;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:16px;margin-bottom:14px;box-shadow:0 6px 24px rgba(245,196,67,.18)}
.otc .lbl{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;opacity:.8}
.otc .who{font-family:var(--disp);font-weight:800;font-size:32px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.otc .meta{font-size:13px;font-weight:600;opacity:.85}
.otc .clock{margin-left:auto;font-family:var(--disp);font-weight:800;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.otc .clock.hot{color:var(--live)}
.otc.paused{background:var(--raised);color:var(--text);box-shadow:none;border:1px solid var(--line)}

/* draft order strip */
.strip{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .stop{min-width:110px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.strip .stop.now{border-color:var(--gold);background:rgba(245,196,67,.08)}
.strip .stop .pk{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
.strip .stop .tn{font-family:var(--disp);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.4px}

/* draft board grid */
.board{display:grid;gap:5px;font-size:12px}
.board .cell{background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:6px 7px;min-height:52px}
.board .cell .p{font-weight:600;font-size:12.5px;line-height:1.2}
.board .cell .m{color:var(--muted);font-size:11px}
.board .cell.empty{background:var(--surface);border-style:dashed}
.board .colhead{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:13px;color:var(--muted);text-align:center;padding:3px 0}

/* countdown */
.count{display:flex;gap:14px;justify-content:center;padding:8px 0 4px}
.count .u{text-align:center}
.count .n{font-family:var(--disp);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.count .l{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600}

/* matchup cards */
.mu{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.mu .side{flex:1}
.mu .side.right{text-align:right}
.mu .tn{font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.4px}
.mu .sc{font-family:var(--disp);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.mu .vs{color:var(--muted);font-size:12px;font-weight:700}
.mu .win{color:var(--gold)}

/* lineup slots */
.slot{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px}
.slot .tag{font-family:var(--disp);font-weight:800;width:44px;text-align:center;color:var(--gold);letter-spacing:.5px}
.slot select{flex:1;min-width:0}
.slot .pt{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;text-align:right}

/* forms/admin */
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.statgrid input{width:52px;padding:5px 6px;text-align:right;font-size:13px}
.danger{border-color:rgba(229,72,77,.5)}
.note{background:rgba(245,196,67,.07);border:1px solid rgba(245,196,67,.3);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* modal + toast */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal h2{font-family:var(--disp);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px}
.teampick{display:grid;gap:8px;margin-bottom:12px}
.teampick button{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:11px;font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.5px;color:var(--text);text-align:left}
.teampick button.on{border-color:var(--gold);color:var(--gold)}
/* matchup, activity, trades */
.rowlink{cursor:pointer}
.rowlink:hover td{background:rgba(245,196,67,.06)}
.mux-head{display:flex;align-items:flex-start;gap:10px;margin:12px 0 14px;padding:14px;background:var(--raised);border:1px solid var(--line);border-radius:12px}
.mh-side{flex:1;min-width:0}
.mh-side.right{text-align:right}
.mh-mid{align-self:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.6px;white-space:nowrap}
.mh-sc{font-family:var(--disp);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;margin-top:2px}
.mh-sc.win{color:var(--gold)}
.prow{display:grid;grid-template-columns:1fr 48px 44px 48px 1fr;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:8px 2px}
.prow:last-of-type{border-bottom:none}
.prow.dim{opacity:.62}
.pcell{min-width:0}
.pcell.right{text-align:right}
.pname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppts{font-family:var(--disp);font-weight:800;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
.slotmid{font-family:var(--disp);font-weight:800;font-size:12px;color:var(--gold);text-align:center;letter-spacing:.5px}
.proj{color:var(--muted)}
.actrow{border-bottom:1px solid var(--line);padding:10px 2px;font-size:14px}
.actrow:last-child{border-bottom:none}
.actrow .sub{margin-top:2px}
@media (max-width:560px){.mh-sc{font-size:26px}.prow{grid-template-columns:1fr 40px 34px 40px 1fr}.pname{font-size:13px}.pmeta{font-size:10.5px}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--gold);color:var(--text);border-radius:99px;padding:10px 18px;font-weight:600;font-size:14px;z-index:200;display:none;max-width:92vw;text-align:center}
.previewbar{background:#2b2410;color:var(--gold);text-align:center;font-size:12.5px;font-weight:600;padding:6px 10px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.statline{font-size:12px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){
  .otc .who{font-size:24px}.otc .clock{font-size:36px}
  .logo-img{height:28px}
}
</style>
</head>

/* Eastern-time wall clock -> Date (handles EDT/EST) */
function etDate(y, mo, d, h, mi) {
  for (const off of [4, 5]) {
    const cand = new Date(Date.UTC(y, mo, d, h + off, mi));
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour12: false, hour: "2-digit" }).format(cand);
    if (parseInt(parts, 10) % 24 === h % 24) return cand;
  }
  return new Date(Date.UTC(y, mo, d, h + 5, mi));
}

/* ---------- league math ---------- */
const DEF_POS = ["LB", "S", "CB", "DE", "DT"];
const TOTAL_TEAMS = 5, ROUNDS = 7, TOTAL_PICKS = TOTAL_TEAMS * ROUNDS, PICK_SECONDS = 30;

function pickInfo(pickNo) { // 1-indexed -> {round, slotIndex, slot}
  const round = Math.ceil(pickNo / TOTAL_TEAMS);
  const idx = (pickNo - 1) % TOTAL_TEAMS;
  const slot = (round % 2 === 1) ? idx + 1 : TOTAL_TEAMS - idx;
  return { round, slot };
}
function teamBySlot(state, slot) { return state.teams.find(t => t.slot === slot); }
function onClockTeam(state) {
  const p = state.picks.length + 1;
  if (p > TOTAL_PICKS) return null;
  return teamBySlot(state, pickInfo(p).slot);
}
function availablePlayers(state) {
  const taken = new Set(state.roster.map(r => r.player_id));
  return state.players.filter(p => !taken.has(p.id)).sort((a, b) => a.rank - b.rank);
}
function rosterOf(state, teamId) {
  const ids = state.roster.filter(r => r.team_id === teamId).map(r => r.player_id);
  const pm = byId(state.players);
  return ids.map(id => pm[id]).filter(Boolean).sort((a, b) => a.rank - b.rank);
}
function playerOwner(state, playerId) {
  const r = state.roster.find(r => r.player_id === playerId);
  return r ? state.teams.find(t => t.id === r.team_id) : null;
}

/* scoring */
function statPoints(s, sc) {
  if (!s) return 0;
  return (s.td||0)*sc.td + (s.yds||0)*sc.yds + (s.rec||0)*sc.rec + (s.fum||0)*sc.fum +
         (s.solo||0)*sc.solo + (s.ast||0)*sc.ast + (s.sack||0)*sc.sack +
         (s.intc||0)*sc.intc + (s.pbu||0)*sc.pbu + (s.ffr||0)*sc.ffr;
}
function playerWeekPoints(state, playerId, week) {
  const s = state.stats.find(x => x.player_id === playerId && x.week === week);
  return statPoints(s, state.settings.scoring);
}

/* lineup: stored row or deterministic auto-lineup (best 2025 pts filling RB/WR/DEF/UTIL) */
function autoLineup(state, teamId) {
  const ros = rosterOf(state, teamId);
  const take = (pred, used) => {
    const c = ros.filter(p => pred(p) && !used.has(p.id)).sort((a, b) => (b.pts_2025 ?? -1) - (a.pts_2025 ?? -1))[0];
    if (c) used.add(c.id);
    return c ? c.id : null;
  };
  const used = new Set();
  const rb = take(p => p.pos === "RB", used);
  const wr = take(p => p.pos === "WR", used);
  const def = take(p => DEF_POS.includes(p.pos), used);
  const util = take(() => true, used);
  return { rb, wr, def, util, auto: true };
}
function lineupFor(state, teamId, week) {
  const row = state.lineups.find(l => l.team_id === teamId && l.week === week);
  if (row && (row.rb || row.wr || row.def || row.util)) return { rb: row.rb, wr: row.wr, def: row.def, util: row.util, auto: false, locked: row.locked };
  return autoLineup(state, teamId);
}
function teamWeekScore(state, teamId, week) {
  const lu = lineupFor(state, teamId, week);
  let total = 0;
  for (const pid of [lu.rb, lu.wr, lu.def, lu.util]) if (pid) total += playerWeekPoints(state, pid, week);
  return total;
}

/* schedule + standings */
function weekGames(state, week) { return state.schedule.filter(s => s.week === week && s.game > 0); }
function weekBye(state, week) { const b = state.schedule.find(s => s.week === week && s.game === 0); return b ? b.bye : null; }
function finalWeeks(state) { return state.settings.final_weeks || []; }
/* a week is complete once Monday night is over: Tuesday 6:00 AM ET after that week's Sunday */
function weekCompleteAt(state, week) {
  const [y, m, d] = state.settings.season_dates.week1_sunday.split("-").map(Number);
  const day = new Date(Date.UTC(y, m - 1, d + (week - 1) * 7 + 2, 12, 0));
  return etDate(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), 6, 0);
}
function weekComplete(state, week) { return Date.now() >= weekCompleteAt(state, week).getTime(); }
/* a week counts once the commish marks it final OR the calendar says it's complete */
function weekIsFinal(state, week) { return finalWeeks(state).includes(week) || weekComplete(state, week); }
function countedWeeks(state) {
  const n = state.settings.season_dates.reg_season_weeks, out = [];
  for (let w = 1; w <= n; w++) if (weekIsFinal(state, w)) out.push(w);
  return out;
}
function standings(state) {
  const rows = state.teams.map(t => ({ team: t, w: 0, l: 0, t: 0, pf: 0, pa: 0 }));
  const rm = Object.fromEntries(rows.map(r => [r.team.id, r]));
  for (const wk of countedWeeks(state)) {
    for (const g of weekGames(state, wk)) {
      if (!g.team_a || !g.team_b) continue;
      const sa = teamWeekScore(state, g.team_a, wk), sb = teamWeekScore(state, g.team_b, wk);
      rm[g.team_a].pf += sa; rm[g.team_a].pa += sb;
      rm[g.team_b].pf += sb; rm[g.team_b].pa += sa;
      if (sa > sb) { rm[g.team_a].w++; rm[g.team_b].l++; }
      else if (sb > sa) { rm[g.team_b].w++; rm[g.team_a].l++; }
      else { rm[g.team_a].t++; rm[g.team_b].t++; }
    }
  }
  const pct = r => { const g = r.w + r.l + r.t; return g ? (r.w + r.t / 2) / g : 0; };
  rows.sort((a, b) => (pct(b) - pct(a)) || (b.w - a.w) || (b.pf - a.pf));
  return rows;
}

/* Lineup locks. Each player locks the moment his NFL game kicks off. A whole week locks once it is
   complete (Tuesday 6:00 AM ET) or when the commish locks it; the commish can also force a week open. */
function lockTime(state, week) { // fallback only: Sundays 12:55 PM ET, used when a player's game can't be found
  const [y, m, d] = state.settings.season_dates.week1_sunday.split("-").map(Number);
  const day = new Date(Date.UTC(y, m - 1, d + (week - 1) * 7, 12, 0));
  return etDate(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), 12, 55);
}
function lockMode(state, week) {
  const m = (state.settings.lineup_locks || {})[week];
  return m === "locked" || m === "open" ? m : "auto";
}
function weekIsLocked(state, teamId, week) {
  const mode = lockMode(state, week);
  if (mode === "open") return false;
  return mode === "locked" || weekComplete(state, week);
}
function playerLocked(state, playerId, week) {
  if (weekIsLocked(state, null, week)) return true;
  if (lockMode(state, week) === "open") return false;
  const gi = gameInfoFor(state, playerId, week);
  if (!gi) return Date.now() > lockTime(state, week).getTime();
  if (gi.st === "in" || gi.st === "post") return true;
  if (gi.st === "bye") return false;
  return !!gi.kick && Date.now() >= new Date(gi.kick).getTime();
}

/* current fantasy week: the first week that isn't complete, so it rolls over Tuesday 6:00 AM ET */
function currentWeek(state) {
  for (let w = 1; w <= 17; w++) if (!weekComplete(state, w)) return w;
  return 17;
}

const ROSTER_CAP = 7;
/* season points to date: every stat line the feed (or the commish grid) has written, all weeks */
function seasonPoints(state, playerId) {
  let sum = 0;
  for (const row of state.stats) if (row.player_id === playerId) sum += statPoints(row, state.settings.scoring);
  return sum;
}
function seasonLabel(state) { return String((state.settings.league || {}).season || new Date().getFullYear()); }
function liveMeta(state) { return state.settings.live_meta || { players: {} }; }
function playerMeta(state, playerId) { return (liveMeta(state).players || {})[playerId] || null; }
function gameInfoFor(state, playerId, week) {
  const lm = liveMeta(state);
  if (lm.week === week && (lm.players || {})[playerId]) return lm.players[playerId];
  const rm = state.settings.roster_meta;
  const abbr = rm && rm.teams ? rm.teams[playerId] : null;
  if (!abbr) return null;
  const gt = GameTimes.get(week);
  if (!gt) return null;
  if (gt[abbr]) return gt[abbr];

}
function injuryMeta(state) { return state.settings.injury_meta || { players: {} }; }
function playerInjury(state, playerId) {

}
function injTitle(i) {

  const when = d && !isNaN(d) ? d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "America/New_York" }) : "";
  return [i.full || i.st, i.type, when ? "updated " + when : ""].filter(Boolean).join(" \u00b7 ");
}
function injBadge(state, playerId) { const i = playerInjury(state, playerId); return i ? ` <span class="pill inj" title="${esc(injTitle(i))}">${esc(i.st)}</span>` : ""; }
function injText(state, playerId) { const i = playerInjury(state, playerId); return i ? ` \u00b7 ${i.st}` : ""; }
function tradesOf(state) { return state.settings.trades || []; }
function generalRules(state) {

  async setLineup(teamId, week, slots) {
    return this._mut(s => {
      s.lineups = s.lineups.filter(l => !(l.team_id === teamId && l.week === week));
      s.lineups.push({ team_id: teamId, week, ...slots, locked: false });
    });
  },
  async lockLineups(week, locked) {
    return this._mut(s => {
      for (const t of s.teams) {
        let row = s.lineups.find(l => l.team_id === t.id && l.week === week);
        if (!row) { const a = autoLineup(s, t.id); row = { team_id: t.id, week, rb: a.rb, wr: a.wr, def: a.def, util: a.util }; s.lineups.push(row); }
        row.locked = locked;
      }
    });
  },
  async saveStats(rows) {
    return this._mut(s => {
      for (const r of rows) {
        s.stats = s.stats.filter(x => !(x.player_id === r.player_id && x.week === r.week));
        s.stats.push(r);
      }
    });
  },
  async saveSetting(key, value) { return this._mut(s => { s.settings[key] = value; }); },
  async updateTeam(teamId, patch) { return this._mut(s => Object.assign(s.teams.find(t => t.id === teamId), patch)); },
  async updateScheduleGame(week, game, patch) {
    return this._mut(s => Object.assign(s.schedule.find(x => x.week === week && x.game === game), patch));
  },
  async resetDraft() {
    return this._mut(s => {
      s.picks = []; s.roster = []; s.txns = []; s.lineups = []; s.stats = [];
      s.draft = { status: "pre", deadline: null, remaining_ms: null };
    });
  }
};

/* ---------- SupaStore (shared database) ---------- */
const SupaStore = {
  name: "supabase",
  client: null,
  async init() {
    this.client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    return this.refresh();
  },
  async refresh() {
    const c = this.client;
    const q = (t, sel = "*") => c.from(t).select(sel);
    const [settings, teams, players, draft, picks, roster, txns, lineups, schedule, stats] = await Promise.all([
      q("league_settings"), q("teams"), q("players"), q("draft_state"), q("picks"),
      q("roster"), c.from("transactions").select("*").order("created_at", { ascending: false }).limit(60),
      q("lineups"), q("schedule"), q("player_stats")
    ]);
    for (const r of [settings, teams, players, draft, picks, roster, txns, lineups, schedule, stats])
      if (r.error) throw r.error;
    const st = emptyState();
    st.settings = Object.fromEntries(settings.data.map(x => [x.key, x.value]));
    st.teams = teams.data.sort((a, b) => a.slot - b.slot);
    st.players = players.data.sort((a, b) => a.rank - b.rank);
    st.draft = draft.data[0] || st.draft;
    st.picks = picks.data.sort((a, b) => a.pick_no - b.pick_no);
    st.roster = roster.data;
    st.txns = txns.data;
    st.lineups = lineups.data;
    st.schedule = schedule.data;
    st.stats = stats.data;
    return st;
  },
  subscribe(onChange) {
    this.client.channel("tmfl").on("postgres_changes", { event: "*", schema: "public" }, () => onChange()).subscribe();
  },
  async setDraft(patch) {
    const { error } = await this.client.from("draft_state").update(patch).eq("id", 1);
    if (error) throw error;
  },
  async makePick(pick, rosterRow, draftPatch) {
    let r = await this.client.from("picks").insert(pick);
    if (r.error) throw new Error("Pick collision, board refreshed");
    r = await this.client.from("roster").insert(rosterRow);
    if (r.error && !String(r.error.message).includes("duplicate")) throw r.error;
    await this.setDraft(draftPatch);
  },
  async undoPick() {
    const { data } = await this.client.from("picks").select("*").order("pick_no", { ascending: false }).limit(1);
    if (!data || !data.length) return;
    const last = data[0];
    await this.client.from("roster").delete().eq("player_id", last.player_id);
    await this.client.from("picks").delete().eq("pick_no", last.pick_no);
  },
  async addDrop(teamId, addId, dropId) {
    if (dropId) {
      const { error } = await this.client.from("roster").delete().eq("player_id", dropId).eq("team_id", teamId);
      if (error) throw error;
    }
    if (addId) {
      const { error } = await this.client.from("roster").insert({ player_id: addId, team_id: teamId, acquired: "fa" });
      if (error) throw new Error("Too slow, someone else grabbed them");
    }
    await this.client.from("transactions").insert({ team_id: teamId, add_player_id: addId, drop_player_id: dropId });
  },
  async applyTrade(moves, drops) {
    for (const mv of moves) {
      const { error } = await this.client.from("roster").update({ team_id: mv.team_id, acquired: "trade" }).eq("player_id", mv.player_id);
      if (error) throw error;
    }
    for (const pid of drops) {
      const { error } = await this.client.from("roster").delete().eq("player_id", pid);
      if (error) throw error;
    }
  },
  async setLineup(teamId, week, slots) {
    const { error } = await this.client.from("lineups").upsert({ team_id: teamId, week, ...slots, updated_at: new Date().toISOString() });
    if (error) throw error;
  },
  async lockLineups(week, locked) {
    for (const t of App.state.teams) {
      const lu = lineupFor(App.state, t.id, week);
      const { error } = await this.client.from("lineups").upsert({ team_id: t.id, week, rb: lu.rb, wr: lu.wr, def: lu.def, util: lu.util, locked });
      if (error) throw error;
    }
  },
  async saveStats(rows) {
    const { error } = await this.client.from("player_stats").upsert(rows);
    if (error) throw error;
  },
  async saveSetting(key, value) {
    const { error } = await this.client.from("league_settings").upsert({ key, value });
    if (error) throw error;
  },
  async updateTeam(teamId, patch) {
    const { error } = await this.client.from("teams").update(patch).eq("id", teamId);
    if (error) throw error;
  },
  async updateScheduleGame(week, game, patch) {
    const { error } = await this.client.from("schedule").update(patch).eq("week", week).eq("game", game);
    if (error) throw error;
  },
  async resetDraft() {
    const c = this.client;
    await c.from("player_stats").delete().neq("week", -1);
    await c.from("lineups").delete().neq("week", -1);
    await c.from("transactions").delete().neq("id", -1);
    await c.from("roster").delete().neq("player_id", -1);
    await c.from("picks").delete().neq("pick_no", -1);
    await c.from("draft_state").update({ status: "pre", deadline: null, remaining_ms: null }).eq("id", 1);
  }
};

</script>
<script>
/* ============================================================
   App controller
   ============================================================ */
const App = {
  store: null, state: null, tab: "team", dirty: false,
  me() { const raw = localStorage.getItem("tmfl_id"); if (!raw) return null; try { return JSON.parse(raw).team_id; } catch (e) { return null; } },
  myTeam() { const id = this.me(); return id ? this.state.teams.find(t => t.id === id) : null; },
  isCommish() { return sessionStorage.getItem("tmfl_commish") === "1"; },

  async boot() {
    this.store = (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) ? SupaStore : LocalStore;
    if (this.store === LocalStore) $("previewbar").style.display = "block";
    try { this.state = await this.store.init(); }
    catch (e) { $("view").innerHTML = `<div class="card"><h2>Connection problem</h2><p>${esc(e.message)}</p><p class="sub">Check the Supabase URL and key in the file config, then reload.</p></div>`; return; }
    this.store.subscribe(() => this.queueRefresh());
    UI.nav();
    window.addEventListener("hashchange", () => this.go());
    this.go();
    setInterval(() => this.pollTick(), 1000);
    setInterval(() => Draft.tick(), 400);
    setInterval(() => LiveSync.tick(), 30000);
    setTimeout(() => LiveSync.tick(), 4000);
    setInterval(() => InjurySync.tick(), 60000);
    setTimeout(() => InjurySync.tick(), 2500);
    setInterval(() => RosterSync.tick(), 3600000);
    setTimeout(() => RosterSync.tick(), 6000);
  },
  go() {
    let t = (location.hash || "#team").slice(1);
    if (t === "draft") t = "team";
    if (t === "matchups") t = "league";
    this.tab = ["team","matchup","players","standings","rosters","activity","league","admin"].includes(t) ? t : "team";
    UI.nav(); UI.render();
  },
  _lastPoll: 0, _refreshing: false, _queued: false,
  pollTick() {
    const live = this.state && (this.state.draft.status === "live" || this.state.draft.status === "paused");
    const every = (live || this.tab === "draft") ? 3000 : 25000;
    if (Date.now() - this._lastPoll >= every) this.queueRefresh();
  },
  async queueRefresh() {
    if (this._refreshing) { this._queued = true; return; }
    this._refreshing = true; this._lastPoll = Date.now();
    try {
      const st = await this.store.refresh();
      const changed = JSON.stringify(st) !== JSON.stringify(this.state);
      this.state = st;
      if (changed) {
        const ae = document.activeElement;
        const editing = ae && ["INPUT","SELECT","TEXTAREA"].includes(ae.tagName) && $("view").contains(ae);
        if (editing) { this.dirty = true; } else { UI.render(); }
      }
    } catch (e) { /* transient network; keep last state */ }
    this._refreshing = false;
    if (this._queued) { this._queued = false; this.queueRefresh(); }
  },
  async mutate(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) { toast(e.message || "That didn't go through"); }
    await this.queueRefresh();
    UI.render();
  }
};

/* ============================================================
   Draft engine
   ============================================================ */
const Draft = {
  _lastAuto: 0,
  deadlineMs() { const d = App.state.draft.deadline; return d ? new Date(d).getTime() : null; },
  secondsLeft() {
    const dl = this.deadlineMs(); if (!dl) return null;
    return Math.max(0, Math.ceil((dl - Date.now()) / 1000));
  },
  tick() {
    if (!App.state) return;
    const st = App.state.draft.status;
    if (App.tab === "draft" && st === "live") {
      const el = $("clock");
      if (el) { const s = this.secondsLeft(); el.textContent = ":" + String(s ?? 0).padStart(2, "0"); el.classList.toggle("hot", s !== null && s <= 10); }
      const cd = $("count-n"); if (cd) UI.countdownTick();
      this.maybeAutopick();
    }
    if (App.tab === "draft" && st === "pre") UI.countdownTick();
  },
  async maybeAutopick() {
    const s = App.state;
    if (s.draft.status !== "live" || s.picks.length >= TOTAL_PICKS) return;
    const dl = this.deadlineMs();
    if (!dl || Date.now() < dl + 2500) return;
    if (Date.now() - this._lastAuto < 4000) return;
    this._lastAuto = Date.now();
    await App.queueRefresh();
    const s2 = App.state;
    const dl2 = s2.draft.deadline ? new Date(s2.draft.deadline).getTime() : null;
    if (s2.draft.status !== "live" || !dl2 || Date.now() < dl2 + 2500 || s2.picks.length >= TOTAL_PICKS) return;
    const team = onClockTeam(s2);
    const best = availablePlayers(s2)[0];
    if (team && best) await this.executePick(best.id, true, true);
  },
  confirmPick(playerId) {
    const p = App.state.players.find(x => x.id === playerId);
    if (!p) return;
    if (confirm(`Are you sure you want to draft ${p.name}?`)) this.executePick(p.id);
  },
  async executePick(playerId, auto = false, silent = false) {
    const s = App.state;
    const pickNo = s.picks.length + 1;
    if (s.draft.status !== "live" || pickNo > TOTAL_PICKS) return;
    const { round, slot } = pickInfo(pickNo);
    const team = teamBySlot(s, slot);
    if (!auto && App.me() !== team.id) { toast("Not your pick"); return; }
    if (s.roster.some(r => r.player_id === playerId)) { toast("Already taken"); return; }
    const player = s.players.find(p => p.id === playerId);
    const done = pickNo === TOTAL_PICKS;
    const patch = done ? { status: "done", deadline: null } : { deadline: new Date(Date.now() + PICK_SECONDS * 1000).toISOString() };
    const pickRow = { pick_no: pickNo, round, slot, team_id: team.id, player_id: playerId, auto };
    const rosterRow = { player_id: playerId, team_id: team.id, acquired: "draft" };
    if (auto) {
      try { await App.store.makePick(pickRow, rosterRow, patch); } catch (e) { /* another client got it first */ }
      await App.queueRefresh(); UI.render();
    } else {
      await App.mutate(() => App.store.makePick(pickRow, rosterRow, patch), silent ? null : `${team.owner} drafts ${player.name}`);
    }
    if (done) toast("Draft complete. Rosters are set, everyone else hits free agency.");
  },
  async start() {
    await App.mutate(() => App.store.setDraft({ status: "live", deadline: new Date(Date.now() + PICK_SECONDS * 1000).toISOString(), remaining_ms: null }), "Draft is live");
  },
  async pause() {
    const dl = this.deadlineMs();
    await App.mutate(() => App.store.setDraft({ status: "paused", remaining_ms: dl ? Math.max(3000, dl - Date.now()) : PICK_SECONDS * 1000 }), "Paused");
  },
  async resume() {
    const rem = App.state.draft.remaining_ms || PICK_SECONDS * 1000;
    await App.mutate(() => App.store.setDraft({ status: "live", deadline: new Date(Date.now() + rem).toISOString(), remaining_ms: null }), "Back live");
  },
  async undo() {
    await App.mutate(async () => {
      await App.store.undoPick();
      await App.store.setDraft({ status: App.state.picks.length <= 1 ? "live" : "live", deadline: new Date(Date.now() + PICK_SECONDS * 1000).toISOString() });
    }, "Last pick undone");
  }
};

/* ============================================================
   UI
   ============================================================ */
const UI = {
  tabs: [["team","My Team"],["matchup","Matchup"],["players","Players"],["standings","Standings"],["rosters","Rosters"],["activity","Activity"],["league","League"],["admin","Admin"]],
  nav() {
    $("nav").innerHTML = this.tabs.map(([id, label]) =>
      `<button class="${App.tab === id ? "on" : ""}" onclick="location.hash='${id}'">${label}</button>`).join("");
    const me = App.myTeam();
    $("idchip").innerHTML = me ? `<b>${esc(me.owner)}</b> &middot; ${esc(me.name)}<span class="tm">™</span>` : "Sign in";
  },
  render() {
    if (!App.state) return;
    App.dirty = false;
    this.nav();
    $("view").innerHTML = Views[App.tab]();
    if (App.tab === "draft") this.countdownTick();
  },

  /* identity modal */
  identity() {
    const s = App.state;
    const cur = App.me();
    $("modalroot").innerHTML = `
      <div class="modalbg" onclick="if(event.target===this)UI.closeModal()">
        <div class="modal">
          <h2>Who are you?</h2>
          <div class="teampick">${s.teams.map(t =>
            `<button class="${cur === t.id ? "on" : ""}" onclick="UI._pickTeam(${t.id},this)">${esc(t.owner)} <span class="sub" style="font-family:var(--body);font-size:12px;text-transform:none;letter-spacing:0"> ${esc(t.name)}™</span></button>`).join("")}
          </div>
          <div class="frow"><input id="pin-in" type="password" inputmode="numeric" placeholder="Team PIN" style="flex:1"></div>
          <div class="btnrow">
            <button class="btn gold" onclick="UI._signIn()">Sign in</button>
            ${cur ? `<button class="btn" onclick="UI._signOut()">Sign out</button>` : ""}
            <button class="btn ghost" onclick="UI.closeModal()">Cancel</button>
          </div>
        </div>
      </div>`;
    this._selTeam = cur;
  },
  _selTeam: null,
  _pickTeam(id, btn) { this._selTeam = id; btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("on")); btn.classList.add("on"); },
  _signIn() {
    const t = App.state.teams.find(x => x.id === this._selTeam);
    const pin = $("pin-in").value.trim();
    if (!t) { toast("Pick your team"); return; }
    if (pin !== t.pin) { toast("Wrong PIN"); return; }
    localStorage.setItem("tmfl_id", JSON.stringify({ team_id: t.id }));
    this.closeModal(); this.render(); toast(`Signed in as ${t.owner}`);
  },
  _signOut() { localStorage.removeItem("tmfl_id"); this.closeModal(); this.render(); },
  closeModal() { $("modalroot").innerHTML = ""; },

  countdownTick() {
    const el = $("count-wrap"); if (!el) return;
    const at = new Date(App.state.settings.draft.scheduled_at).getTime();
    let diff = Math.max(0, at - Date.now());
    const d = Math.floor(diff / 86400000); diff -= d * 86400000;
    const h = Math.floor(diff / 3600000); diff -= h * 3600000;
    const m = Math.floor(diff / 60000); const s = Math.floor((diff - m * 60000) / 1000);
    el.innerHTML = [[d,"days"],[h,"hrs"],[m,"min"],[s,"sec"]].map(([n,l]) =>
      `<div class="u"><div class="n">${String(n).padStart(2,"0")}</div><div class="l">${l}</div></div>`).join("");
  }
};

/* ============================================================
   Views
   ============================================================ */
const Views = {

  /* ---------- DRAFT ---------- */
  draft() {
    const s = App.state, st = s.draft.status;
    if (st === "pre") return this._draftPre();
    if (st === "done") return this._draftDone();
    return this._draftLive();
  },
  _draftPre() {
    const s = App.state;
    const when = new Date(s.settings.draft.scheduled_at);
    return `
      <div class="card" style="text-align:center">
        <h2>Draft Day</h2>
        <p class="sub">${when.toLocaleString("en-US",{weekday:"long",month:"long",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:"America/New_York"})} ET &middot; Snake &middot; ${ROUNDS} rounds &middot; ${PICK_SECONDS}s per pick</p>
        <div class="count" id="count-wrap"></div>
        <p class="sub" style="margin-top:8px">Draft order: ${s.teams.map(t => esc(t.owner)).join(" &rarr; ")}</p>
        ${App.isCommish() ? `<div class="btnrow" style="justify-content:center"><button class="btn gold" onclick="Draft.start()">Start the draft</button></div>` : ``}
      </div>
      ${this._bigBoardCard(false)}`;
  },
  _draftLive() {
    const s = App.state;
    const paused = s.draft.status === "paused";
    const team = onClockTeam(s);
    const pickNo = s.picks.length + 1;
    const { round } = pickInfo(Math.min(pickNo, TOTAL_PICKS));
    const meOn = team && App.me() === team.id;
    const strip = [];
    for (let p = pickNo; p < Math.min(pickNo + 6, TOTAL_PICKS + 1); p++) {
      const t = teamBySlot(s, pickInfo(p).slot);
      strip.push(`<div class="stop ${p === pickNo ? "now" : ""}"><div class="pk">RD ${pickInfo(p).round} &middot; PK ${p}</div><div class="tn">${esc(t.owner)}</div></div>`);
    }
    return `
      <div class="otc ${paused ? "paused" : ""}">
        <div>
          <div class="lbl">${paused ? "Draft paused" : "On the clock"}</div>
          <div class="who">${team ? esc(team.name) : ""}<span class="tm">™</span></div>
          <div class="meta">Round ${round} &middot; Pick ${pickNo} of ${TOTAL_PICKS} &middot; ${esc(team ? team.owner : "")}</div>
        </div>
        <div class="clock" id="clock">${paused ? "&#10074;&#10074;" : ""}</div>
      </div>
      ${meOn && !paused ? `<div class="note">You're up. Hit Draft next to your guy below.</div>` : ""}
      <div class="strip">${strip.join("")}</div>
      ${App.isCommish() ? `<div class="btnrow" style="margin-bottom:12px">
        ${paused ? `<button class="btn gold sm" onclick="Draft.resume()">Resume</button>` : `<button class="btn sm" onclick="Draft.pause()">Pause</button>`}
        <button class="btn sm" onclick="if(confirm('Undo the last pick?'))Draft.undo()">Undo last pick</button>
      </div>` : ""}
      ${this._bigBoardCard(true)}
      ${this._draftBoardCard()}`;
  },
  _draftDone() {
    return `
      <div class="card" style="text-align:center">
        <h2>Draft Complete</h2>
        <p class="sub">Rosters are locked in. Everyone undrafted is in free agency. Go set your Week 1 lineup on the My Team tab.</p>
      </div>
      ${this._draftBoardCard()}
      ${this._bigBoardCard(false)}`;
  },
  _bigBoardCard(liveDraft) {
    const s = App.state;
    const q = (this._q || "").toLowerCase();
    const posF = this._pos || "ALL";
    const faOnly = this._fa !== false;
    const taken = new Set(s.roster.map(r => r.player_id));
    let rows = s.players.filter(p =>
      (!q || p.name.toLowerCase().includes(q) || p.nfl_team.toLowerCase().includes(q)) &&
      (posF === "ALL" || (posF === "DEF" ? DEF_POS.includes(p.pos) : p.pos === posF)) &&
      (!faOnly || !taken.has(p.id)));
    const sp = {}; for (const p of s.players) sp[p.id] = seasonPoints(s, p.id);
    const srank = {}; [...s.players].sort((a, b) => (sp[b.id] - sp[a.id]) || (a.rank - b.rank)).forEach((p, i) => { srank[p.id] = i + 1; });
    rows.sort((a, b) => srank[a.id] - srank[b.id]);
    const team = onClockTeam(s);
    const canDraft = liveDraft && s.draft.status === "live" && team && App.me() === team.id;
    const postDraft = s.draft.status === "done";
    const me = App.myTeam();
    const html = rows.map(p => {
      const owner = playerOwner(s, p.id);
      const clickable = liveDraft && !owner && canDraft;
      let action = "";
      if (liveDraft && !owner) action = `<button class="btn gold sm" ${canDraft ? "" : "disabled"}>Draft</button>`;
      else if (postDraft && !owner && me) action = `<button class="btn sm" onclick="Views.addPlayer(${p.id})">Add</button>`;
      const status = owner ? `<span class="pill own">${esc(owner.owner)}</span>` : `<span class="pill fa">FA</span>`;
      return `<tr class="${owner && me && owner.id === me.id ? "mine" : ""}${clickable ? " pickable" : ""}" ${clickable ? `onclick="Draft.confirmPick(${p.id})"` : ""}>
        <td class="num">${srank[p.id]}</td>
        <td>${esc(p.name)}${injBadge(s, p.id)} ${p.rookie ? '<span class="pill rk">R</span>' : ""}</td>
        <td><span class="pill pos">${esc(p.pos)}</span></td>
        <td class="sub">${esc(p.nfl_team)}</td>
        <td class="num">${fmt1(sp[p.id])}</td>
        <td>${status}</td><td>${action}</td></tr>`;
    }).join("");
    return `
      <div class="card">
        <h2>Big Board</h2>
        <div class="frow">
          <input id="bb-q" placeholder="Search player or team" value="${esc(this._q || "")}" oninput="Views.search(this.value)" style="flex:1;min-width:150px">
          <select onchange="Views._pos=this.value;UI.render()">
            ${["ALL","RB","WR","DEF"].map(p => `<option ${posF === p ? "selected" : ""}>${p}</option>`).join("")}
          </select>
          <label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" ${faOnly ? "checked" : ""} onchange="Views._fa=this.checked;UI.render()"> Available Players</label>
        </div>
        <div class="tablewrap"><table>
          <tr><th class="num">RK</th><th>Player</th><th>Pos</th><th>Team</th><th class="num">${seasonLabel(s)} Pts</th><th>Status</th><th></th></tr>
          ${html || `<tr><td colspan="7" class="empty">No players match</td></tr>`}
        </table></div>
      </div>`;
  },
  _draftBoardCard() {
    const s = App.state;
    const pm = byId(s.players);
    const pickMap = {};
    for (const p of s.picks) pickMap[`${p.round}-${p.slot}`] = p;
    let grid = `<div class="board" style="grid-template-columns:repeat(${TOTAL_TEAMS},1fr)">`;
    grid += s.teams.map(t => `<div class="colhead">${esc(t.owner)}</div>`).join("");
    for (let r = 1; r <= ROUNDS; r++) {
      for (let sl = 1; sl <= TOTAL_TEAMS; sl++) {
        const pk = pickMap[`${r}-${sl}`];
        if (pk) {
          const pl = pm[pk.player_id];
          grid += `<div class="cell"><div class="p">${esc(pl.name)}</div><div class="m">${esc(pl.pos)} &middot; PK ${pk.pick_no}${pk.auto ? " &middot; AUTO" : ""}</div></div>`;
        } else grid += `<div class="cell empty"><div class="m">RD ${r}</div></div>`;
      }
    }
    grid += "</div>";
    return `<div class="card"><h2>Draft Board</h2><div class="tablewrap" style="border:none;overflow-x:auto">${grid}</div></div>`;
  },

  search(q) {
    this._q = q; UI.render();
    const el = $("bb-q");
    if (el) { el.focus(); el.setSelectionRange(q.length, q.length); }

  /* ---------- MY TEAM ---------- */
  _wk: null,
  team() {
    const s = App.state, me = App.myTeam();
    if (!me) return `<div class="card"><h2>My Team</h2><p class="sub">Sign in to manage your squad.</p><div class="btnrow"><button class="btn gold" onclick="UI.identity()">Sign in</button></div></div>`;
    const mine = rosterOf(s, me.id);
    const row = standings(s).find(r => r.team.id === me.id);
    const wk = this._wk || Math.min(currentWeek(s), 17);
    const lu = lineupFor(s, me.id, wk);
    const locked = weekIsLocked(s, me.id, wk);
    const opts = (slotKey, elig) => {
      const chosen = [lu.rb, lu.wr, lu.def, lu.util].filter(Boolean);
      return `<option value="">Empty</option>` + mine.filter(p => elig(p) && !playerLocked(s, p.id, wk)).map(p => {
        const usedElsewhere = chosen.includes(p.id) && lu[slotKey] !== p.id;
        return `<option value="${p.id}" ${lu[slotKey] === p.id ? "selected" : ""} ${usedElsewhere ? "disabled" : ""}>${esc(p.name)} (${esc(p.pos)})${injText(s, p.id)}</option>`;
      }).join("");
    };
    const pm = byId(s.players);
    const slotRow = (tag, key, elig) => {
      const cur = lu[key];
      const slotLocked = locked || (!!cur && playerLocked(s, cur, wk));
      const label = cur ? (pm[cur] ? `${esc(pm[cur].name)} (${esc(pm[cur].pos)})${injText(s, cur)}` : "Unknown") : "Empty";
      const sel = slotLocked
        ? `<select id="lu-${key}" disabled><option value="${cur || ""}" selected>${label} &middot; Locked</option></select>`
        : `<select id="lu-${key}" onchange="Views._luChange()">${opts(key, elig)}</select>`;
      return `
      <div class="slot"><div class="tag">${tag}</div>
        ${sel}
        <div class="pt">${cur ? fmt1(seasonPoints(s, cur)) : "&mdash;"}</div>
      </div>`;
    };
    const benchIds = mine.filter(p => ![lu.rb, lu.wr, lu.def, lu.util].includes(p.id));
    const pend = tradesOf(s).filter(t => t.status === "pending" && (t.to === me.id || t.from === me.id));

    return `
      <div class="card">
        <h2>${tmName(me)}</h2>
        <p class="sub">${esc(me.owner)} &middot; Record ${row.w}-${row.l}${row.t ? "-" + row.t : ""} &middot; PF ${fmt1(row.pf)}</p>
        <div class="btnrow" style="margin-top:10px">
          <button class="btn sm" onclick="Views.renameModal()">Rename team</button>

        </div>
      </div>
      <div class="card">
        <h2>Lineup</h2>
        <div class="frow">
          <select onchange="Views._wk=+this.value;UI.render()">${Array.from({length:17},(_,i)=>i+1).map(w =>
            `<option value="${w}" ${w === wk ? "selected" : ""}>Week ${w}${w >= 16 ? " (Playoffs)" : ""}</option>`).join("")}</select>
          ${locked ? `<span class="pill bye">Locked</span>` : lockMode(s, wk) === "open" ? `<span class="pill own">Unlocked by commish</span>` : `<span class="sub">Players lock at kickoff &middot; next week opens Tue 6 AM ET</span>`}
          ${lu.auto ? `<span class="pill bye">Auto-set</span>` : ""}
        </div>
        <div class="sub" style="text-align:right;margin-top:8px">${seasonLabel(s)} season pts</div>
        ${slotRow("RB","rb",p => p.pos === "RB")}
        ${slotRow("WR","wr",p => p.pos === "WR")}
        ${slotRow("DEF","def",p => DEF_POS.includes(p.pos))}
        ${slotRow("UTIL","util",() => true)}
        <h3>Bench</h3>
        ${benchIds.length ? benchIds.map(p => `<div class="slot"><div class="tag" style="color:var(--muted)">BE</div><div style="flex:1">${esc(p.name)}${injBadge(s, p.id)} <span class="pill pos">${esc(p.pos)}</span>${!locked && playerLocked(s, p.id, wk) ? ` <span class="pill bye">Locked</span>` : ""}</div><div class="pt">${fmt1(seasonPoints(s, p.id))}</div></div>`).join("") : `<p class="sub">Empty bench</p>`}
        ${!locked ? `<div class="btnrow"><button class="btn gold" onclick="Views.saveLineup(${wk})">Save lineup</button></div>` : ""}
        <p class="sub" style="margin-top:8px">${(() => { const im = s.settings.injury_meta; return im && im.updated_at ? `Injury report via ESPN, updated ${new Date(im.updated_at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" })} ET` : "Injury report not synced yet"; })()}</p>
      </div>
      <div class="card">
        <h2>Roster</h2>
        <div class="tablewrap"><table>
          <tr><th>Player</th><th>Pos</th><th>Team</th><th class="num">${seasonLabel(s)}</th><th>Via</th><th></th></tr>
          ${mine.map(p => `<tr><td>${esc(p.name)}${injBadge(s, p.id)}</td><td><span class="pill pos">${esc(p.pos)}</span></td><td class="sub">${esc(p.nfl_team)}</td><td class="num">${fmt1(seasonPoints(s, p.id))}</td><td class="sub">${(s.roster.find(r => r.player_id === p.id) || {}).acquired === "fa" ? "FA" : "Draft"}</td><td>${s.draft.status === "done" ? `<button class="btn sm" onclick="Views.dropPlayer(${p.id})">Drop</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">No players yet. See you at the draft.</td></tr>`}
        </table></div>

  _luChange() { /* selections read on save */ },
  renameModal() {

      <div class="modalbg" onclick="if(event.target===this)UI.closeModal()">
        <div class="modal">

        </div>
      </div>`;

  renameMyTeam() {
    const me = App.myTeam(); if (!me) return;
    const name = $("rn-me").value.trim();
    if (!name) { toast("Name can't be empty"); return; }
    if (name === me.name) { toast("That's already your name"); return; }
    UI.closeModal();
    App.mutate(() => App.store.updateTeam(me.id, { name }), `You are now ${name}`);
  },
  saveLineup(week) {
    const s = App.state, me = App.myTeam();
    if (weekIsLocked(s, me.id, week)) { toast(`Week ${week} lineups are locked`); return; }
    const base = lineupFor(s, me.id, week), pm = byId(s.players);
    const val = k => { const v = $("lu-" + k).value; return v ? +v : null; };
    const slots = { rb: val("rb"), wr: val("wr"), def: val("def"), util: val("util") };
    for (const k of Object.keys(slots)) {
      if (base[k] && playerLocked(s, base[k], week)) { slots[k] = base[k]; continue; } // a player who kicked off stays put
      if (slots[k] && playerLocked(s, slots[k], week)) { toast(`${(pm[slots[k]] || {}).name || "That player"} already kicked off, he can't move`); return; }
    }
    const ids = Object.values(slots).filter(Boolean);
    if (new Set(ids).size !== ids.length) { toast("Same player in two slots"); return; }
    App.mutate(() => App.store.setLineup(me.id, week, slots), `Week ${week} lineup saved`);
  },

  /* ---------- ROSTERS ---------- */
  rosters() {
    const s = App.state;
    const rows = standings(s);
    const me = App.myTeam();
    const canTrade = me && s.draft.status === "done";
    const shown = me ? s.teams.filter(t => t.id !== me.id) : s.teams;
    return `<div class="grid2">` + shown.map(t => {
      const r = rows.find(x => x.team.id === t.id);
      const mine = rosterOf(s, t.id);
      const tradeable = canTrade && t.id !== me.id;
      return `<div class="card">
        <h2>${tmName(t)}</h2>
        <p class="sub">${esc(t.owner)} &middot; ${r.w}-${r.l}${r.t ? "-" + r.t : ""} &middot; PF ${fmt1(r.pf)}</p>
        <div class="tablewrap" style="margin-top:8px"><table>
          ${mine.map(p => `<tr${tradeable ? ` class="rowlink" onclick="Views.tradeStart(${p.id})"` : ""}><td>${esc(p.name)}${injBadge(s, p.id)}</td><td><span class="pill pos">${esc(p.pos)}</span></td><td class="sub">${esc(p.nfl_team)}</td><td class="num">${fmt1(seasonPoints(s, p.id))}</td></tr>`).join("") || `<tr><td class="empty">Empty until the draft</td></tr>`}
        </table></div>
      </div>`;
    }).join("") + `</div>`;
  },

  /* ---------- TRADES ---------- */
  _tr: null,
  tradeStart(playerId) {
    const s = App.state, me = App.myTeam();
    if (!me) { UI.identity(); return; }
    if (s.draft.status !== "done") { toast("Trades open after the draft"); return; }
    const owner = playerOwner(s, playerId);
    if (!owner || owner.id === me.id) return;
    this._tr = { to: owner.id, get: [playerId], give: [], from_drops: [] };
    this.tradeStep1();
  },
  _tradeToggle(side, pid, el) {
    const arr = this._tr[side];
    const i = arr.indexOf(pid);
    if (i >= 0) arr.splice(i, 1); else arr.push(pid);
    el.classList.toggle("on", i < 0);
  },
  _trBtn(side, p) {
    return `<button class="${this._tr[side].includes(p.id) ? "on" : ""}" onclick="Views._tradeToggle('${side}',${p.id},this)">${esc(p.name)}${injBadge(App.state, p.id)} <span class="sub" style="font-size:12px;font-family:var(--body);text-transform:none;letter-spacing:0">${esc(p.pos)}</span></button>`;
  },
  tradeStep1() {
    const s = App.state, tr = this._tr;
    const them = s.teams.find(t => t.id === tr.to);
    $("modalroot").innerHTML = `
      <div class="modalbg" onclick="if(event.target===this)UI.closeModal()">
        <div class="modal" style="max-width:520px">
          <h2>Trade with ${esc(them.owner)}</h2>
          <p class="sub" style="margin:4px 0 8px">Step 1 of 2 &middot; Tap the players you want from ${esc(them.name)}:</p>
          <div class="teampick">${rosterOf(s, tr.to).map(p => this._trBtn("get", p)).join("")}</div>
          <div class="btnrow" style="margin-top:12px">
            <button class="btn gold" onclick="Views.tradeStep2()">Next</button>
            <button class="btn ghost" onclick="UI.closeModal()">Cancel</button>
          </div>
        </div>
      </div>`;
  },
  tradeStep2() {
    const s = App.state, me = App.myTeam(), tr = this._tr;
    if (!tr.get.length) { toast("Pick at least one player to receive"); return; }
    $("modalroot").innerHTML = `
      <div class="modalbg" onclick="if(event.target===this)UI.closeModal()">
        <div class="modal" style="max-width:520px">
          <h2>Your side</h2>
          <p class="sub" style="margin:4px 0 8px">Step 2 of 2 &middot; Tap the players you send from ${esc(me.name)}:</p>
          <div class="teampick">${rosterOf(s, me.id).map(p => this._trBtn("give", p)).join("")}</div>
          <div class="btnrow" style="margin-top:12px">
            <button class="btn gold" onclick="Views.tradeConfirm()">Submit</button>
            <button class="btn" onclick="Views.tradeStep1()">Back</button>
            <button class="btn ghost" onclick="UI.closeModal()">Cancel</button>
          </div>
        </div>
      </div>`;
  },
  tradeConfirm() {
    const s = App.state, me = App.myTeam(), tr = this._tr;
    if (!tr.give.length) { toast("Pick at least one player to send"); return; }
    const them = s.teams.find(t => t.id === tr.to);
    const pm = byId(s.players);
    const names = ids => ids.map(id => esc((pm[id] || {}).name || "?")).join(", ");
    const myCount = rosterOf(s, me.id).length - tr.give.length + tr.get.length;
    const over = Math.max(0, myCount - ROSTER_CAP);
    tr.from_drops = [];
    const keepers = over > 0 ? rosterOf(s, me.id).filter(p => !tr.give.includes(p.id)) : [];
    $("modalroot").innerHTML = `
      <div class="modalbg" onclick="if(event.target===this)UI.closeModal()">
        <div class="modal" style="max-width:520px">
          <h2>Are you sure you want to submit?</h2>
          <p class="sub" style="margin:4px 0 4px">You get from ${esc(them.owner)}: <b>${names(tr.get)}</b></p>
          <p class="sub" style="margin:0 0 8px">You send: <b>${names(tr.give)}</b></p>
          ${over > 0 ? `
          <p class="sub" style="margin:8px 0 8px">This puts you at ${myCount} players and the cap is ${ROSTER_CAP}. Pick ${over} of yours to drop to free agency:</p>
          <div class="teampick">${keepers.map(p => this._trBtn("from_drops", p)).join("")}</div>` : ""}
          <div class="btnrow" style="margin-top:12px">
            <button class="btn gold" onclick="Views.tradeSend(${over})">Yes, send trade</button>
            <button class="btn" onclick="Views.tradeStep2()">Back</button>
            <button class="btn ghost" onclick="UI.closeModal()">Cancel</button>
          </div>
        </div>
      </div>`;
  },
  tradeSend(needDrops) {
    const s = App.state, me = App.myTeam(), tr = this._tr;
    if (tr.from_drops.length !== needDrops) { toast(`Pick exactly ${needDrops} to drop`); return; }
    const them = s.teams.find(t => t.id === tr.to);
    const trade = { id: Date.now(), from: me.id, to: tr.to, give: tr.give, get: tr.get, from_drops: tr.from_drops, status: "pending", created_at: new Date().toISOString() };
    UI.closeModal();
    App.mutate(() => App.store.saveSetting("trades", [...tradesOf(s), trade]), `Trade sent to ${them.owner}`);
  },
  tradesModal() {
    const s = App.state, me = App.myTeam();
    if (!me) { UI.identity(); return; }
    const pm = byId(s.players), tm = byId(s.teams);
    const pend = tradesOf(s).filter(t => t.status === "pending" && (t.to === me.id || t.from === me.id));
    const names = ids => (ids || []).map(id => esc((pm[id] || {}).name || "?")).join(", ");
    const rows = pend.map(t => {
      const incoming = t.to === me.id;
      const other = tm[incoming ? t.from : t.to];
      return `<div class="mu" style="flex-wrap:wrap">
        <div class="side">
          <div class="tn" style="font-size:15px">${incoming ? "From" : "Sent to"} ${esc(other.owner)}</div>
          <div class="sub">You get: <b>${names(incoming ? t.give : t.get)}</b></div>
          <div class="sub">You send: <b>${names(incoming ? t.get : t.give)}</b></div>
          ${(t.from_drops || []).length ? `<div class="sub">${incoming ? esc(other.owner) + " also drops" : "You also drop"}: ${names(t.from_drops)}</div>` : ""}
        </div>
        <div class="btnrow">${incoming
          ? `<button class="btn gold sm" onclick="Views.tradeAccept(${t.id})">Accept</button><button class="btn sm" onclick="Views.tradeResolve(${t.id},'rejected')">Decline</button>`
          : `<button class="btn sm" onclick="Views.tradeResolve(${t.id},'cancelled')">Cancel offer</button>`}</div>
      </div>`;
    }).join("");
    $("modalroot").innerHTML = `
      <div class="modalbg" onclick="if(event.target===this)UI.closeModal()">
        <div class="modal" style="max-width:520px">
          <h2>Trades</h2>
          ${rows || `<p class="sub" style="margin:4px 0 8px">No pending trades. Hit the Rosters tab and tap a player on another team to start one.</p>`}
          <div class="btnrow" style="margin-top:12px"><button class="btn ghost" onclick="UI.closeModal()">Close</button></div>
        </div>
      </div>`;
  },
  _acceptDrops: [], _acceptId: null,
  _acceptToggle(pid, el) {
    const a = this._acceptDrops;
    const i = a.indexOf(pid);
    if (i >= 0) a.splice(i, 1); else a.push(pid);
    el.classList.toggle("on", i < 0);
  },
  tradeAccept(id) {
    const s = App.state, me = App.myTeam();
    const t = tradesOf(s).find(x => x.id === id);
    if (!t || t.status !== "pending" || !me || t.to !== me.id) return;
    const ok = t.give.every(pid => (playerOwner(s, pid) || {}).id === t.from)
            && t.get.every(pid => (playerOwner(s, pid) || {}).id === t.to)
            && (t.from_drops || []).every(pid => (playerOwner(s, pid) || {}).id === t.from);
    if (!ok) { this.tradeResolve(id, "cancelled"); toast("Trade voided: rosters changed since the offer"); return; }
    this._acceptDrops = []; this._acceptId = id;
    const myCount = rosterOf(s, me.id).length - t.get.length + t.give.length;
    const over = myCount - ROSTER_CAP;
    if (over > 0) {
      const keepers = rosterOf(s, me.id).filter(p => !t.get.includes(p.id));
      $("modalroot").innerHTML = `
        <div class="modalbg" onclick="if(event.target===this)UI.closeModal()">
          <div class="modal" style="max-width:520px">
            <h2>Over the roster cap</h2>
            <p class="sub" style="margin:4px 0 8px">Accepting puts you at ${myCount} players. The cap is ${ROSTER_CAP}. Pick ${over} of yours to drop to free agency:</p>
            <div class="teampick">${keepers.map(p => `<button onclick="Views._acceptToggle(${p.id},this)">${esc(p.name)}${injBadge(s, p.id)} <span class="sub" style="font-size:12px;font-family:var(--body);text-transform:none;letter-spacing:0">${esc(p.pos)}</span></button>`).join("")}</div>
            <div class="btnrow" style="margin-top:12px">
              <button class="btn gold" onclick="Views.tradeFinish(${over})">Accept trade</button>
              <button class="btn ghost" onclick="UI.closeModal()">Cancel</button>
            </div>
          </div>
        </div>`;
      return;
    }
    this.tradeFinish(0);
  },
  async tradeFinish(needDrops) {
    if (this._acceptDrops.length !== needDrops) { toast(`Pick exactly ${needDrops} to drop`); return; }
    const s = App.state;
    const t = tradesOf(s).find(x => x.id === this._acceptId);
    if (!t) return;
    UI.closeModal();
    const moves = [...t.give.map(pid => ({ player_id: pid, team_id: t.to })), ...t.get.map(pid => ({ player_id: pid, team_id: t.from }))];
    const drops = [...(t.from_drops || []), ...this._acceptDrops];
    const list = tradesOf(s).map(x => x.id === t.id ? { ...x, status: "accepted", to_drops: this._acceptDrops, resolved_at: new Date().toISOString() } : x);
    const touched = [...t.give, ...t.get, ...drops];
    await App.mutate(async () => {
      await App.store.applyTrade(moves, drops);
      await App.store.saveSetting("trades", list);
      await Views._scrubLineups([t.from, t.to], touched);
    }, "Trade accepted");
  },
  tradeResolve(id, status) {
    const s = App.state;
    const list = tradesOf(s).map(x => x.id === id ? { ...x, status, resolved_at: new Date().toISOString() } : x);
    UI.closeModal();
    App.mutate(() => App.store.saveSetting("trades", list), status === "rejected" ? "Trade declined" : "Trade cancelled");
  },
  async _scrubLineups(teamIds, movedPids) {
    const s = App.state;
    const cw = Math.min(currentWeek(s), 17), fw = finalWeeks(s);
    for (const tid of teamIds) {
      for (let w = cw; w <= 17; w++) {
        if (fw.includes(w) || weekIsLocked(s, tid, w)) continue;
        const lu = lineupFor(s, tid, w);
        const slots = { rb: lu.rb, wr: lu.wr, def: lu.def, util: lu.util };
        let touched = false;
        for (const k of Object.keys(slots)) if (slots[k] && movedPids.includes(slots[k]) && !playerLocked(s, slots[k], w)) { slots[k] = null; touched = true; }
        if (touched) await App.store.setLineup(tid, w, slots);
      }
    }
  },

  /* ---------- RECENT ACTIVITY ---------- */
  activity() {
    const s = App.state;
    const pm = byId(s.players), tm = byId(s.teams);
    const nm = id => esc((pm[id] || {}).name || "?");
    const when = ts => ts ? new Date(ts).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET" : "";
    const items = [];
    for (const tx of s.txns) {
      const t = tm[tx.team_id]; if (!t) continue;
      const bits = [];
      if (tx.add_player_id) bits.push(`added <b>${nm(tx.add_player_id)}</b>`);
      if (tx.drop_player_id) bits.push(`dropped <b>${nm(tx.drop_player_id)}</b>`);
      if (!bits.length) continue;
      items.push({ ts: tx.created_at, html: `<div class="actrow"><div><b style="color:var(--gold)">${esc(t.name)}</b> ${bits.join(", ")}</div><div class="sub">${when(tx.created_at)} &middot; Free agency</div></div>` });
    }
    for (const t of tradesOf(s)) {
      const A = tm[t.from], B = tm[t.to]; if (!A || !B) continue;
      const line = `<b style="color:var(--gold)">${esc(A.name)}</b> sends <b>${(t.give || []).map(nm).join(", ")}</b> to <b style="color:var(--gold)">${esc(B.name)}</b> for <b>${(t.get || []).map(nm).join(", ")}</b>`;
      const drops = [...(t.from_drops || []), ...(t.to_drops || [])];
      if (t.status === "pending") items.push({ ts: t.created_at, html: `<div class="actrow"><div>Trade proposed: ${line}</div><div class="sub">${when(t.created_at)} &middot; Pending</div></div>` });
      else items.push({ ts: t.resolved_at || t.created_at, html: `<div class="actrow"><div>Trade ${t.status}: ${line}${t.status === "accepted" && drops.length ? `. Dropped to FA: <b>${drops.map(nm).join(", ")}</b>` : ""}</div><div class="sub">${when(t.resolved_at || t.created_at)} &middot; Trade</div></div>` });
    }
    items.sort((a, b) => new Date(b.ts) - new Date(a.ts));
    return `<div class="card"><h2>Recent Activity</h2>${items.length ? items.map(i => i.html).join("") : `<p class="empty">No moves yet. Free agency pickups and trades will show up here.</p>`}</div>`;
  },

  /* ---------- PLAYERS ---------- */
  players() {
    const s = App.state;
    const recent = s.txns.slice(0, 8).map(tx => {
      const t = s.teams.find(x => x.id === tx.team_id);
      const a = tx.add_player_id ? s.players.find(p => p.id === tx.add_player_id) : null;
      const d = tx.drop_player_id ? s.players.find(p => p.id === tx.drop_player_id) : null;
      return `<div class="statline">${esc(t.owner)}: ${a ? "added " + esc(a.name) : ""}${a && d ? ", " : ""}${d ? "dropped " + esc(d.name) : ""}</div>`;
    }).join("");
    return this._bigBoardCard(s.draft.status === "live") +
      (recent ? `<div class="card"><h2>Recent Moves</h2>${recent}</div>` : "");
  },

  /* ---------- SCOREBOARD (inside League) ---------- */
  _mwk: null,
  scoreboardCard() {
    const s = App.state;
    const wk = this._mwk || Math.min(currentWeek(s), 17);
    const isFinal = weekIsFinal(s, wk);
    const games = weekGames(s, wk);
    const bye = weekBye(s, wk);
    const tm = byId(s.teams);
    const cards = games.map(g => {
      if (!g.team_a || !g.team_b) return `<div class="mu"><div class="side"><div class="tn sub">${esc(g.label || "TBD")}</div></div></div>`;
      const A = tm[g.team_a], B = tm[g.team_b];
      const sa = teamWeekScore(s, g.team_a, wk), sb = teamWeekScore(s, g.team_b, wk);
      const aw = isFinal && sa > sb, bw = isFinal && sb > sa;
      return `<div class="mu">
        <div class="side"><div class="tn ${aw ? "win" : ""}">${esc(A.name)}<span class="tm">™</span></div><div class="sub">${esc(A.owner)}</div><div class="sc ${aw ? "win" : ""}">${fmt1(sa)}</div></div>
        <div class="vs">${isFinal ? "FINAL" : "VS"}</div>
        <div class="side right"><div class="tn ${bw ? "win" : ""}">${esc(B.name)}<span class="tm">™</span></div><div class="sub">${esc(B.owner)}</div><div class="sc ${bw ? "win" : ""}">${fmt1(sb)}</div></div>
      </div>`;
    }).join("");
    return `
      <div class="card">
        <h2>Scoreboard</h2>
        <div class="frow">
          <select onchange="Views._mwk=+this.value;UI.render()">${Array.from({length:17},(_,i)=>i+1).map(w =>
            `<option value="${w}" ${w === wk ? "selected" : ""}>Week ${w}${w === 16 ? " (Semifinals)" : w === 17 ? " (Championship)" : ""}</option>`).join("")}</select>
          ${isFinal ? `<span class="pill bye">Final</span>` : `<span class="pill live" style="animation:none;background:var(--raised);border:1px solid var(--line);color:var(--muted)">Live totals</span>`}
        </div>
        ${cards || `<p class="empty">No games this week</p>`}
        ${bye ? `<div class="mu"><div class="side"><div class="tn">${esc(tm[bye].name)}<span class="tm">™</span></div><div class="sub">${esc(tm[bye].owner)}</div></div><span class="pill bye">BYE WEEK</span></div>` : ""}
      </div>`;
  },

  /* ---------- MATCHUP (head-to-head, ESPN style) ---------- */
  _xwk: null,
  matchup() {
    const s = App.state, me = App.myTeam();
    const wk = this._xwk || Math.min(currentWeek(s), 17);
    const isFinal = weekIsFinal(s, wk);
    const sel = `<select onchange="Views._xwk=+this.value;UI.render()">${Array.from({length:17},(_,i)=>i+1).map(w =>
      `<option value="${w}" ${w === wk ? "selected" : ""}>Week ${w}${w === 16 ? " (Semifinals)" : w === 17 ? " (Championship)" : ""}</option>`).join("")}</select>`;
    if (!me) return `<div class="card"><h2>Matchup</h2><p class="sub">Sign in to see your head-to-head.</p><div class="btnrow"><button class="btn gold" onclick="UI.identity()">Sign in</button></div></div>`;
    const g = weekGames(s, wk).find(x => x.team_a === me.id || x.team_b === me.id);
    if (!g) {
      const bye = weekBye(s, wk) === me.id;
      return `<div class="card"><h2>Matchup</h2><div class="frow">${sel}</div>
        <p class="empty">${bye ? "You're on bye this week. Enjoy the rest." : "No game for you this week."} The full slate lives on the <a href="#league">Scoreboard</a>.</p></div>`;
    }
    if (!g.team_a || !g.team_b) return `<div class="card"><h2>Matchup</h2><div class="frow">${sel}</div><p class="empty">${esc(g.label || "Playoff game")} &middot; Seeds lock after week 15.</p></div>`;
    return this._matchupCard(g, wk, isFinal, sel);
  },
  _matchupCard(g, wk, isFinal, sel) {
    const s = App.state;
    const tm = byId(s.teams), rows = standings(s);
    const A = tm[g.team_a], B = tm[g.team_b];
    const rA = rows.find(x => x.team.id === A.id), rB = rows.find(x => x.team.id === B.id);
    const sa = teamWeekScore(s, A.id, wk), sb = teamWeekScore(s, B.id, wk);
    const luA = lineupFor(s, A.id, wk), luB = lineupFor(s, B.id, wk);
    const rec = r => `${r.w}-${r.l}${r.t ? "-" + r.t : ""}`;
    const aw = isFinal && sa > sb, bw = isFinal && sb > sa;
    const slotRow = (key, tag, dim) => `<div class="prow${dim ? " dim" : ""}">${this._muxPlayer(luA[key], wk, false)}<div class="ppts">${this._muxPts(luA[key], wk)}</div><div class="slotmid">${tag}</div><div class="ppts">${this._muxPts(luB[key], wk)}</div>${this._muxPlayer(luB[key], wk, true)}</div>`;
    const startersA = [luA.rb, luA.wr, luA.def, luA.util], startersB = [luB.rb, luB.wr, luB.def, luB.util];
    const benchA = rosterOf(s, A.id).filter(p => !startersA.includes(p.id));
    const benchB = rosterOf(s, B.id).filter(p => !startersB.includes(p.id));
    const benchRows = Array.from({ length: Math.max(benchA.length, benchB.length) }, (_, i) =>
      `<div class="prow dim">${this._muxPlayer((benchA[i] || {}).id, wk, false)}<div class="ppts">${this._muxPts((benchA[i] || {}).id, wk)}</div><div class="slotmid">BE</div><div class="ppts">${this._muxPts((benchB[i] || {}).id, wk)}</div>${this._muxPlayer((benchB[i] || {}).id, wk, true)}</div>`).join("");
    return `
      <div class="card">
        <div class="frow" style="justify-content:space-between">${sel}${isFinal ? `<span class="pill bye">Final</span>` : `<span class="pill bye">Live</span>`}</div>
        <div class="mux-head">
          <div class="mh-side"><div class="tn ${aw ? "win" : ""}">${tmName(A)}</div><div class="sub">${esc(A.owner)} &middot; ${rec(rA)}</div><div class="mh-sc ${aw ? "win" : ""}">${fmt1(sa)}</div></div>
          <div class="mh-mid">WK ${wk}</div>
          <div class="mh-side right"><div class="tn ${bw ? "win" : ""}">${tmName(B)}</div><div class="sub">${esc(B.owner)} &middot; ${rec(rB)}</div><div class="mh-sc ${bw ? "win" : ""}">${fmt1(sb)}</div></div>
        </div>
        ${slotRow("rb","RB")}${slotRow("wr","WR")}${slotRow("def","DEF")}${slotRow("util","UTIL")}
        <h3 style="margin-top:14px">Bench</h3>
        ${benchRows || `<p class="sub">Empty benches</p>`}
      </div>`;
  },
  _muxPlayer(pid, wk, right) {
    if (!pid) return `<div class="pcell${right ? " right" : ""}"><div class="pname sub">Empty</div></div>`;
    const s = App.state, p = s.players.find(x => x.id === pid);
    if (!p) return `<div class="pcell"></div>`;
    const m = gameInfoFor(s, pid, wk);
    const line = this._statLine(pid, wk);
    const status = m ? `${m.opp ? (m.home ? "vs " : "@ ") + esc(m.opp) + " &middot; " : ""}${esc(m.dt || "")}` : "";
    return `<div class="pcell${right ? " right" : ""}">
      <div class="pname">${esc(p.name)}${injBadge(s, p.id)}</div>
      <div class="pmeta">${esc(p.pos)} &middot; ${esc(p.nfl_team)}</div>
      ${status || line ? `<div class="pmeta">${status}${status && line ? " &middot; " : ""}${line}</div>` : ""}
    </div>`;
  },
  _statLine(pid, wk) {
    const st = App.state.stats.find(x => x.player_id === pid && x.week === wk);
    if (!st) return "";
    const b = [];
    if (st.rec) b.push(`${st.rec} rec`);
    if (st.yds) b.push(`${fmt1(st.yds).replace(/\.0$/, "")} yds`);
    if (st.td) b.push(`${st.td} TD`);
    if (st.solo || st.ast) b.push(`${st.solo || 0}-${st.ast || 0} tkl`);
    if (st.sack) b.push(`${fmt1(st.sack).replace(/\.0$/, "")} sk`);
    if (st.intc) b.push(`${st.intc} INT`);
    if (st.pbu) b.push(`${st.pbu} PBU`);
    if (st.ffr) b.push(`${st.ffr} FF/FR`);
    if (st.fum) b.push(`${st.fum} FUM`);
    return b.join(", ");
  },
  /* blank until the player's game kicks off, then his live points (0.0 to start), then the final number */
  _muxPts(pid, wk) {
    if (!pid) return `<span class="sub">&mdash;</span>`;
    const s = App.state;
    const m = gameInfoFor(s, pid, wk);
    const has = s.stats.some(x => x.player_id === pid && x.week === wk);
    const started = has || weekIsFinal(s, wk) || (m && (m.st === "in" || m.st === "post"));
    return started ? fmt1(playerWeekPoints(s, pid, wk)) : "";
  },

  league() {

        <div class="card">
          <h2>League Rules</h2>

          <p class="sub">15-week regular season, rotating bye (one team off each week). Everyone plays everyone 3 times. Weeks 16-17: playoffs, top 4 seeds. Each player locks at his kickoff; the lineup week rolls over Tuesday at 6 AM ET.</p>
          <h3>General Rules</h3>
          <ul class="rulelist">${generalRules(s).map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        </div>
        <div class="card">
          <h2>Scoring</h2>
          <div class="tablewrap"><table>
            ${[["Touchdown", sc.td],["Yard gained", sc.yds],["Reception", sc.rec],["Fumble lost", sc.fum],["Solo tackle", sc.solo],["Assist", sc.ast],["Sack", sc.sack],["Interception", sc.intc],["Pass breakup", sc.pbu],["Forced fumble / recovery", sc.ffr]].map(([l, v]) =>
              `<tr><td>${l}</td><td class="num">${v > 0 ? "+" : ""}${v}</td></tr>`).join("")}
          </table></div>
        </div>
      </div>
      <div class="card">
        <h2>Schedule</h2>
        <div class="tablewrap"><table>
          <tr><th class="num">WK</th><th>Games</th><th>Bye</th></tr>${schedRows.join("")}
          <tr><td class="num">16</td><td>Semifinals: 1v4, 2v3</td><td class="sub">5 seed out</td></tr>
          <tr><td class="num">17</td><td>Championship + 3rd place game</td><td class="sub"></td></tr>
        </table></div>
      </div>
      ${draftRows ? `<div class="card"><h2>Draft Results</h2><div class="tablewrap"><table><tr><th class="num">PK</th><th>RD</th><th>Team</th><th>Player</th><th>Pos</th></tr>${draftRows}</table></div></div>` : ""}`;
  },

        <div class="btnrow" style="margin-top:8px">
          <button class="btn gold" onclick="LiveSync.sync(${wk}, true)">Sync week ${wk} now</button>
          <button class="btn" onclick="Views._toggleFeed()">${this._feedOn() ? "Turn auto-sync off" : "Turn auto-sync on"}</button>
